<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <meta http-equiv="refresh"
          content="0.3;url=https://www.profitableratecpmnetwork.com/qwwttjbm6?key=7df1a1257c9684dce3c5287bab8a32ff">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .loader-container {
            text-align: center;
        }

        .loader {
            width: 55px;
            height: 55px;
            border: 5px solid #ddd;
            border-top: 5px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 18px;
        }

        .loading-text {
            font-size: 16px;
            color: #333;
            letter-spacing: 0.5px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script>
        setTimeout(function () {
            window.location.replace(
                "https://www.profitableratecpmnetwork.com/qwwttjbm6?key=7df1a1257c9684dce3c5287bab8a32ff"
            );
        }, 300);
    </script>
</head>

<body>

    <div class="loader-container">
        <div class="loader"></div>
        <div class="loading-text">Loading...</div>
    </div>

</body>
</html>
